name: Xero bot

on:
  # Safety net only: if the chain ever breaks, the next slot restarts the bot.
  schedule:
    - cron: "35 4,10,16,22 * * *"
  # Start it by hand from the Actions tab. "chained" is set to true only by the run that starts its successor.
  workflow_dispatch:
    inputs:
      chained:
        description: "Started by the previous run (adds the short break). Leave false when you start it yourself."
        type: boolean
        default: false

# Never two copies at the same time. A new run waits (pending) until the running one has finished.
concurrency:
  group: xero-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write        # needed so a run can start the next run

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358          # hard safety net (GitHub's own limit is 360)
    steps:
      - uses: actions/checkout@v4

      # 1) Line up the NEXT run right now. It stays "pending" until this run has finished, then starts by itself.
      - name: Queue the next run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run xero-bot.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f chained=true

      # 2) The break between runs (only for runs that were started by the previous run).
      - name: Short break between runs
        if: ${{ inputs.chained }}
        run: sleep 120

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run the 5m + 1h monitor for 5h50m
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # SIGINT after 350 minutes = the script's normal Ctrl+C shutdown. Exit code 124 just means "time is up".
          timeout --foreground -s INT -k 60 350m python -u xero_signal_5m1h.py || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "$code"; fi

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xero-logs-${{ github.run_id }}
          path: xero_signal_logs/
          retention-days: 7
          if-no-files-found: ignore
