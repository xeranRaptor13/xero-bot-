name: Xero bot

on:
  # Starts at 04:35, 10:35, 16:35 and 22:35 UTC (05:35, 11:35, 17:35 and 23:35 Nigerian time).
  # Each run lasts 5h50m, so there is a ~10 minute gap before the next one.
  schedule:
    - cron: "35 4,10,16,22 * * *"
  # Lets you start it by hand from the Actions tab.
  workflow_dispatch:

# Never two copies at the same time.
concurrency:
  group: xero-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358          # hard safety net (GitHub's own limit is 360)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run the 3m + 5m monitor for 5h50m
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # SIGINT after 350 minutes = the script's normal Ctrl+C shutdown. Exit code 124 just means "time is up".
          timeout --foreground -s INT -k 60 350m python -u xero_signal_3m5m.py || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "$code"; fi

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xero-logs-${{ github.run_id }}
          path: xero_signal_logs/
          retention-days: 7
          if-no-files-found: ignore
