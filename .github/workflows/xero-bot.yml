name: Xero bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: xero-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run the bot for 5h50m
        env:
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DERIV_PAT:          ${{ secrets.DERIV_PAT }}
          DERIV_APP_ID:       ${{ secrets.DERIV_APP_ID }}
          DERIV_ACCOUNT_ID:   ${{ secrets.DERIV_ACCOUNT_ID }}
          ALLOW_REAL_TRADING: ${{ vars.ALLOW_REAL_TRADING || '0' }}
        run: |
          timeout -s INT -k 60 350m python -u xero_signal_15tick_5tick_enforced.py || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "$code"; fi

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xero-logs-${{ github.run_id }}
          path: xero_signal_logs/
          retention-days: 7
          if-no-files-found: ignore
