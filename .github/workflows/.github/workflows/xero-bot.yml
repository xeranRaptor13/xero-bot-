name: Xero bot

on:
  # Starts at 04:35, 10:35, 16:35 and 22:35 UTC (05:35, 11:35, 17:35 and 23:35 Nigerian time).
  # Each run lasts 5h50m, so there is a ~10 minute gap before the next one.
  schedule:
    - cron: "35 4,10,16,22 * * *"
  # Lets you start it by hand from the Actions tab.
  workflow_dispatch:

# Never two bots at the same time (two bots = double trades).
concurrency:
  group: xero-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358          # hard safety net (GitHub's own limit is 360)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run the bot for 5h50m
        env:
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DERIV_PAT:          ${{ secrets.DERIV_PAT }}
          DERIV_APP_ID:       ${{ secrets.DERIV_APP_ID }}
          DERIV_ACCOUNT_ID:   ${{ secrets.DERIV_ACCOUNT_ID }}
          ALLOW_REAL_TRADING: ${{ vars.ALLOW_REAL_TRADING || '0' }}
        run: |
          # SIGINT after 350 minutes = the bot's normal Ctrl+C shutdown. Exit code 124 just means "time is up".
          timeout -s INT -k 60 350m python -u xero_signal_15tick_5tick_enforced.py || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "$code"; fi

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xero-logs-${{ github.run_id }}
          path: xero_signal_logs/
          retention-days: 7
          if-no-files-found: ignore
